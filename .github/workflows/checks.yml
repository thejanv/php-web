name: Checks

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Check PHP syntax
        run: |
          find src -name "*.php" -exec php -l {} \;
